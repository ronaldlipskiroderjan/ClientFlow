<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto | ClientFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="../css/style.css" rel="stylesheet">
    <script>
        // Aplica tema antes do render para evitar flash
        (function(){
            var t = localStorage.getItem('clientflow-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body class="bg-arctic-gray">

<div class="d-flex app-shell">
    <div id="sidebar-container"></div>

    <main class="main-content flex-grow-1 min-vh-100">
        <div class="container-fluid py-4 px-3 px-lg-4">

            <!-- Cabeçalho do projeto -->
            <section class="page-header-card mb-4">
                <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <a href="dashboard_client.html" class="btn btn-icon-soft" title="Voltar aos Projetos">
                            <i class="fa-solid fa-arrow-left"></i>
                        </a>
                        <div>
                            <h1 class="h4 fw-bold mb-0 text-navy-blue" id="nav-project-title">Carregando...</h1>
                            <p class="text-muted mb-0 small">Detalhes e envio de documentos do projeto</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Container dos itens -->
            <div id="items-container"></div>

            <div id="empty-state" class="surface-panel empty-state-card text-center py-5 d-none">
                <i class="fa-solid fa-box-open fs-1 text-muted opacity-50 mb-3"></i>
                <h5 class="fw-bold mb-2">Nenhum item encontrado</h5>
                <p class="text-muted mb-0">Este projeto não tem itens cadastrados ainda.</p>
            </div>
        </div>

        <footer class="footer text-center mt-auto py-4 bg-white border-top">
            <div class="container text-center">
                <div class="text-muted small">&copy; 2026 ClientFlow. Todos os direitos reservados.</div>
            </div>
        </footer>
    </main>
</div>

<!-- Floating Chat Button -->
<button id="openChatBtn" class="btn btn-primary-custom rounded-circle position-fixed shadow-lg d-flex align-items-center justify-content-center"
        style="bottom: 28px; right: 28px; width: 58px; height: 58px; z-index: 1040;" title="Abrir chat com o prestador de serviço">
    <i class="fa-solid fa-comments fs-5"></i>
</button>

<!-- Floating Chat Widget -->
<div class="floating-chat-widget d-none shadow-lg" id="floatingChatWidget" style="z-index: 1050;">
    <div class="floating-chat-header text-white p-3 d-flex justify-content-between align-items-center rounded-top-custom">
        <div>
            <h6 class="mb-0 fw-bold">Chat do Projeto</h6>
            <small class="opacity-75 d-block" id="chatAgencyName" style="font-size: 0.75rem;">Prestador de Serviço</small>
        </div>
        <button type="button" class="btn-close btn-close-white" id="closeFloatingChat" aria-label="Close"></button>
    </div>
    <div class="chat-box p-3" id="widgetChatBox">
        <div class="d-flex h-100 align-items-center justify-content-center">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        </div>
    </div>
    <div class="chat-input-area p-2 rounded-bottom-custom">
        <form id="widgetMessageForm" class="d-flex gap-2 m-0 h-100 align-items-center">
            <input type="text" id="widgetMessageInput" class="form-control bg-light border-0 px-3 h-100"
                   placeholder="Sua mensagem..." required autocomplete="off" style="font-size: 0.9rem;">
            <button type="submit" class="btn btn-primary-custom rounded d-flex align-items-center justify-content-center px-3 h-100" id="widgetBtnSend">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js?v=2"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/checklist_details.js?v=3"></script>
</body>
</html>
