<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos e Upgrade | ClientFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="planos-page">

<div id="clientflow-app" class="d-flex flex-column min-vh-100">
    <!-- Sidebar e Navbar serão inseridos aqui pelo SidebarManager -->
    
    <main class="flex-grow-1">
        <div class="container-fluid py-4 px-3 px-md-4">
            
            <!-- Cabeçalho -->
            <div class="mb-4">
                <h1 class="h2 fw-bold text-navy-blue mb-2">
                    <i class="fas fa-layer-group text-primary me-2"></i>Planos e Upgrade
                </h1>
                <p class="text-muted">Gerenciar sua assinatura e fazer upgrade de plano</p>
            </div>

            <!-- Plano Atual -->
            <div class="row mb-5">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-3">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold app-brand mb-3">
                                <i class="fas fa-check-circle text-success me-2"></i>Seu Plano
                            </h5>
                            <div id="planoAtualContainer">
                                <div class="spinner-border spinner-border-sm text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                                <span class="ms-2 text-muted">Carregando informações do plano...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Uso de Recursos -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-3">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold app-brand mb-3">
                                <i class="fas fa-chart-pie text-warning me-2"></i>Seu Uso
                            </h5>
                            <div id="usoRecursosContainer">
                                <div class="spinner-border spinner-border-sm text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                                <span class="ms-2 text-muted">Carregando dados de uso...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Planos Disponíveis -->
            <div class="mb-5">
                <h4 class="fw-bold text-navy-blue mb-4">Planos Disponíveis</h4>
                <div class="row g-4" id="planosContainer">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                        <p class="text-muted mt-3">Carregando planos disponíveis...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Modal de Confirmação de Upgrade -->
<div class="modal fade" id="confirmUpgradeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-3">
            <div class="modal-header border-0 px-4 pt-4">
                <h5 class="modal-title fw-bold text-navy-blue">Confirmar Alteracao de Plano</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 py-3">
                <p id="confirmUpgradeText" class="planos-confirm-text mb-0"></p>
            </div>
            <div class="modal-footer border-0 px-4 pb-4">
                <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary-custom" id="btnConfirmUpgrade">Confirmar Alteracao</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/planos.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await SidebarManager.init();
        await PlanosManager.init();
    });
</script>

</body>
</html>
