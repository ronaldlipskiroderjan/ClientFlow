<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin | ClientFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="../css/style.css" rel="stylesheet">
    <script>
        (function () {
            var t = localStorage.getItem('clientflow-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>

<body class="bg-arctic-gray">

    <div class="d-flex">
        <div class="main-content flex-grow-1 min-vh-100">
            <div class="container-fluid py-4">
                <div class="row mb-1 px-2">
                    <div
                        class="col-12 d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                        <div>
                            <span class="badge bg-primary-soft text-primary mb-3">Administrador do Sistema</span>
                            <h1 class="fw-bold text-navy-blue" id="adminTitle">Painel Administrativo</h1>
                            <p class="text-muted" id="adminSubtitle">Gerencie usuários, identifique problemas e mantenha
                                a plataforma segura.</p>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-secondary" onclick="window.location.href='login.html'">Voltar
                                ao login</button>
                            <button class="btn btn-danger" onclick="Auth.logout()">Sair</button>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div
                            class="card card-custom p-4 border-0 border-start border-info border-4 h-100 shadow-sm rounded-4">
                            <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.75rem;">Usuários
                                Ativos</p>
                            <h2 class="fw-bold mb-0 text-navy-blue" id="kpi-users">--</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div
                            class="card card-custom p-4 border-0 border-start border-success border-4 h-100 shadow-sm rounded-4">
                            <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.75rem;">Agências</p>
                            <h2 class="fw-bold mb-0 text-success" id="kpi-agencies">--</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div
                            class="card card-custom p-4 border-0 border-start border-warning border-4 h-100 shadow-sm rounded-4">
                            <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.75rem;">Clientes</p>
                            <h2 class="fw-bold mb-0 text-warning" id="kpi-clients">--</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div
                            class="card card-custom p-4 border-0 border-start border-primary border-4 h-100 shadow-sm rounded-4">
                            <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.75rem;">Alertas
                                Recentes</p>
                            <h2 class="fw-bold mb-0 text-primary" id="kpi-alerts">--</h2>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <div class="card border-0 p-4 shadow-sm rounded-4 h-100">
                            <h5 class="fw-bold text-navy-blue mb-4">Ações Disponíveis</h5>
                            <a href="admin_usuarios.html" class="btn btn-primary btn-lg w-100 py-3 rounded-4 shadow-sm">
                                <i class="fa-solid fa-users-gear me-3"></i>
                                Gerenciar Usuários do Sistema
                            </a>
                        </div>
                    </div>
                </div>

                <footer class="footer text-center mt-auto py-4 bg-white border-top">
                    <div class="container text-center">
                        <div class="text-muted small">
                            &copy; 2026 ClientFlow. Todos os direitos reservados.
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/api.js?v=2"></script>
    <script src="../js/dashboard_admin.js?v=1"></script>
</body>

</html>
